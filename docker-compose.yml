services:

  ingesta-clientes:
    build:
      context: ./ingesta-clientes
    container_name: ingesta-clientes
    env_file:
      - ./ingesta-clientes/.env
    # Fallback: si algún día no usas IamInstanceProfile (ver infra.yml),
    # boto3 recogerá credenciales de este archivo montado. Si no existe
    # en el host, Docker monta un directorio vacío y boto3 simplemente
    # sigue al siguiente proveedor de credenciales (el instance profile),
    # así que dejarlo montado no rompe nada aunque no lo uses.
    volumes:
      - /home/ubuntu/.aws:/root/.aws:ro
    restart: unless-stopped

  ingesta-vehiculos:
    build:
      context: ./ingesta-vehiculos
    container_name: ingesta-vehiculos
    env_file:
      - ./ingesta-vehiculos/.env
    volumes:
      - /home/ubuntu/.aws:/root/.aws:ro
    restart: unless-stopped

  ingesta-envios:
    build:
      context: ./ingesta-envios
    container_name: ingesta-envios
    env_file:
      - ./ingesta-envios/.env
    volumes:
      - /home/ubuntu/.aws:/root/.aws:ro
    restart: unless-stopped
